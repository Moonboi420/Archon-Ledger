<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archon Ledger</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0f0a;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        #errorOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        #errorOverlay.visible {
            display: flex;
        }

        #errorBox {
            background: #0a0f0a;
            border: 2px solid #ff0040;
            border-radius: 12px;
            padding: 2.5rem 3rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 60px rgba(255, 0, 64, 0.15);
            animation: errorPulse 2s ease-in-out infinite;
        }

        @keyframes errorPulse {
            0%, 100% {
                box-shadow: 0 0 60px rgba(255, 0, 64, 0.15);
            }

            50% {
                box-shadow: 0 0 80px rgba(255, 0, 64, 0.25);
            }
        }

        #errorIcon {
            font-size: 3rem;
            color: #ff0040;
            margin-bottom: 0.5rem;
        }

        #errorTitle {
            color: #ff0040;
            font-weight: 400;
            letter-spacing: 2px;
            font-size: 1.4rem;
            margin-bottom: 0.75rem;
        }

        #errorMessage {
            color: #ff4166;
            font-size: 0.95rem;
            line-height: 1.6;
            word-break: break-word;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            transition: opacity 0.4s ease;
        }

        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #overlay .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #003300;
            border-top: 3px solid #00ff41;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #overlay p {
            font-size: 1.1rem;
            color: #00cc33;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1500px;
            width: 100%;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #00ff4133;
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #00ff4133;
            padding-bottom: 0.5rem;
        }

        .table-wrapper {
            overflow-x: auto;
            border: 1px solid #00ff4133;
            border-radius: 6px;
            padding: 1px;
            background: #00ff4108;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 1100px;
        }

        th {
            text-align: left;
            padding: 0.6rem 0.4rem;
            border-bottom: 1px solid #00ff4144;
            color: #00cc33;
            font-weight: 400;
            letter-spacing: 1px;
            font-size: 0.75rem;
            text-transform: uppercase;
            background: #0a0f0a;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 0.4rem;
            border-bottom: 1px solid #00ff4122;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .drag-handle {
            cursor: grab;
            color: #00ff4166;
            user-select: none;
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        select,
        input {
            background: #0f1a0f;
            border: 1px solid #00ff4144;
            color: #00ff41;
            padding: 0.25rem 0.35rem;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.8rem;
            width: 100%;
            min-width: 60px;
            transition: border 0.15s;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #00ff41;
            box-shadow: 0 0 8px #00ff4122;
        }

        select option {
            background: #0a0f0a;
            color: #00ff41;
        }

        input[type="text"] {
            min-width: 100px;
        }

        input::placeholder {
            color: #00ff4133;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .address-input {
            min-width: 120px;
            resize: vertical;
            font-family: inherit;
            font-size: 0.75rem;
            line-height: 1.4;
            padding: 0.25rem;
            background: #0f1a0f;
            border: 1px solid #00ff4144;
            color: #00ff41;
            border-radius: 4px;
            width: 100%;
            min-height: 28px;
        }

        .address-input:focus {
            outline: none;
            border-color: #00ff41;
            box-shadow: 0 0 8px #00ff4122;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff004066;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 0.2rem;
            transition: color 0.15s;
            line-height: 1;
        }

        .delete-btn:hover {
            color: #ff0040cc;
        }

        .total-row td {
            border-top: 2px solid #00ff4166;
            padding-top: 0.75rem;
            font-weight: bold;
            color: #00ff41dd;
        }

        .total-row td:first-child {
            font-size: 1rem;
        }

        .text-muted {
            color: #00ff4166;
        }

        .text-right {
            text-align: right;
        }

        .text-center {
            text-align: center;
        }

        .mono {
            font-feature-settings: "tnum";
        }

        .ratio-hidden {
            opacity: 0.3;
        }

        .symbol-select {
            min-width: 80px;
            background: #0f1a0f;
            border: 1px solid #00ff4144;
            color: #00ff41;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.8rem;
            padding: 0.25rem;
            width: 100%;
        }

        .symbol-select:focus {
            outline: none;
            border-color: #00ff41;
        }

        /* Row with multi-line addresses gets taller naturally */
        td:has(.address-input[rows]) {
            vertical-align: top;
        }

        /* ─── BUTTON GROUP ────────────────────────────────────────────── */
        .button-group {
            display: flex;
            gap: 0.6rem;
            margin-top: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .add-row-btn,
        .import-export-btn {
            padding: 0.25rem 0.9rem;
            background: transparent;
            border: 1px solid #00ff4144;
            color: #00ff41;
            border-radius: 3px;
            font-family: inherit;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.15s;
            line-height: 1.4;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .add-row-btn:hover,
        .import-export-btn:hover {
            background: #00ff4111;
            border-color: #00ff41;
        }

        /* Export button (green tint) */
        .export-btn {
            border-color: #00ff4166;
        }

        .export-btn:hover {
            background: #00ff4111;
            border-color: #00ff41;
        }

        /* Import button (amber tint) */
        .import-btn {
            border-color: #ffaa0044;
            color: #ffaa00;
        }

        .import-btn:hover {
            background: #ffaa0011;
            border-color: #ffaa00;
        }

        /* ─── HIDDEN FILE INPUT ────────────────────────────────────── */
        #fileInput {
            display: none;
        }

        /* Hidden file input */
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <!-- BLACK OVERLAY -->
    <div id="overlay">
        <div class="spinner"></div>
        <p>Fetching Prices …</p>
    </div>

    <!-- ERROR OVERLAY -->
    <div id="errorOverlay" style="display:none;">
        <div id="errorBox">
            <div id="errorIcon">⚠</div>
            <h2 id="errorTitle">Error</h2>
            <p id="errorMessage">Something went wrong.</p>
        </div>
    </div>

    <div class="container">
        <h1>ARCHON LEDGER</h1>
        <div class="table-wrapper">
            <table id="portfolioTable">
                <thead>
                    <tr>
                        <th style="width:24px;"></th>
                        <th style="min-width:80px;">Symbol</th>
                        <th style="min-width:70px;">Qty</th>
                        <th style="min-width:50px;">Ratio</th>
                        <th style="min-width:70px;">Price</th>
                        <th style="min-width:80px;">Value</th>
                        <th style="min-width:75px;">Target</th>
                        <th style="min-width:75px;">Δ</th>
                        <th style="min-width:75px;">Δ Value</th>
                        <th style="min-width:140px;">Addresses</th>
                        <th style="width:30px;"></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- rows injected by JS -->
                </tbody>
                <tfoot id="tableFoot">
                    <tr class="total-row">
                        <td colspan="4" style="text-align:right; font-size:1rem;">TOTAL VALUE</td>
                        <td id="totalValue" colspan="8" style="font-size:1.1rem; letter-spacing:1px;">$0.00</td>
                    </tr>
                </tfoot>
            </table>
        </div>
        <div class="button-group">
            <button class="add-row-btn" id="addRowBtn">+ ADD ROW</button>
            <button class="import-export-btn export-btn" id="exportBtn">⬇ EXPORT</button>
            <button class="import-export-btn import-btn" id="importBtn">⬆ IMPORT</button>
            <input type="file" id="fileInput" accept=".json" />
        </div>
    </div>

    <script>
        // ─── GLOBALS ──────────────────────────────────────────────
        let prices={};
        const holdings=[]; // each entry: { symbol, qty, ratio, targetWeight, addresses }
        let nextId=1;

        // ─── DOM REFS ─────────────────────────────────────────────
        const tbody=document.getElementById('tableBody');
        const totalEl=document.getElementById('totalValue');

        // ─── HELPERS ──────────────────────────────────────────────
        function clampNonNegative(v,fallback) {
            const n=parseFloat(v);
            return (!isNaN(n)&&n>=0)? n:fallback;
        }

        function clampPercent(v,fallback) {
            const n=parseFloat(v);
            return (!isNaN(n)&&n>=0&&n<=1)? n:fallback;
        }

        function fmt$(n) {
            // Handle negative numbers
            const sign=n<0? '-':'';
            const absN=Math.abs(n);

            // Round to 3 significant figures
            let rounded;
            if(absN===0) {
                rounded=0;
            } else {
                const digits=Math.floor(Math.log10(absN))+1;
                const factor=Math.pow(10,3-digits);
                rounded=Math.round(absN*factor)/factor;
            }

            // Format with commas
            const parts=`${rounded}`.split('.');
            parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');

            return sign+'$'+parts.join('.');
        }

        function fmtDelta(n){
            const sign = n<0 ? '-': (n>0 ? '+' : '');
            const absN=Math.abs(n);
            if (absN==0) return 0;
            const digits=Math.floor(Math.log10(absN))+1;
            const factor=Math.pow(10,3-digits);
            const rounded = Math.round(absN*factor)/factor;
            return `${sign}${rounded}`
        }

        function pct(n) {return (n*100).toFixed(1)+'%';}

        // ─── RENDER ──────────────────────────────────────────────
        function render() {
            // compute totals
            let totalValue=0;
            const rows=holdings.map(h => {
                const price=prices[h.symbol]||0;
                const value=price*h.qty*h.ratio;
                totalValue+=value;
                return {...h,price,value};
            });

            // compute actual weights, target values & deltas
            rows.forEach(r => {
                r.actualWeight=totalValue>0? r.value/totalValue:0;
                r.targetValue=r.targetWeight*totalValue/100;
                // Delta in units: (targetWeight * totalValue - currentValue) / price
                // Positive = need to buy, negative = need to sell
                const price= r.price * r.ratio;
                r.deltaValue = price>0 ? (r.targetValue-r.value) : 0;
                r.deltaUnits= r.deltaValue / price;
            });

            // build HTML
            let html='';
            const symbolOptions=Object.keys(prices).sort();
            rows.forEach((r,idx) => {
                const ratioClass=r.ratio===1? 'ratio-input ratio-hidden':'ratio-input';
                const deltaColor=r.deltaUnits>0 ? '#00ff88':
                    r.deltaUnits<0? '#ff4444':'#00ff4166';

                html+=`<tr data-id="${r.id}">`;
                html+=`<td class="drag-handle" draggable="true">⠿</td>`;

                // Symbol dropdown
                html+=`<td><select class="symbol-select" data-id="${r.id}">`;
                symbolOptions.forEach(sym => {
                    const sel=sym===r.symbol? 'selected':'';
                    html+=`<option value="${sym}" ${sel}>${sym}</option>`;
                });
                html+=`</select></td>`;

                html+=`<td><input type="number" class="qty-input" value="${r.qty}" step="any"/></td>`;
                html+=`<td class="ratio-cell"><input type="number" class="${ratioClass}" value="${r.ratio}" step="1"/></td>`;
                html+=`<td class="text-right mono">${fmt$(r.price)}</td>`;
                html+=`<td class="text-right mono">${fmt$(r.value)}</td>`;
                html+=`<td><input type="number" class="target-input" value="${r.targetWeight}" step="0.01"/></td>`;
                html+=`<td class="text-right" style="color:${deltaColor}">${fmtDelta(r.deltaUnits)}</td>`;
                html+=`<td class="text-right" style="color:${deltaColor}">${fmt$(r.deltaValue)}</td>`;
                html+=`<td><textarea class="address-input" rows="${Math.max(1,(r.addresses||'').split('\n').length)}" placeholder="0x...&#10;0x...">${r.addresses||''}</textarea></td>`;
                html+=`<td><button class="delete-btn" data-id="${r.id}">✕</button></td>`;
                html+=`</tr>`;
            });

            tbody.innerHTML=html;
            totalEl.textContent=fmt$(totalValue);

            // re-bind events
            bindEvents();
        }

        // ─── EVENT BINDING ──────────────────────────────────────
        function bindEvents() {
            // Symbol changes
            document.querySelectorAll('.symbol-select').forEach(sel => {
                sel.onchange=function(e) {
                    const id=parseInt(this.dataset.id);
                    const h=holdings.find(x => x.id===id);
                    if(h&&this.value) {
                        h.symbol=this.value;
                        render();
                    }
                };
            });

            // Qty changes
            document.querySelectorAll('.qty-input').forEach(inp => {
                inp.onchange=function(e) {
                    const id=parseInt(this.closest('tr').dataset.id);
                    const h=holdings.find(x => x.id===id);
                    if(h) {
                        const val=parseFloat(this.value);
                        h.qty=(!isNaN(val)&&val>=0)? val:h.qty;
                        render();
                    }
                };
            });

            // Ratio changes
            document.querySelectorAll('.ratio-input').forEach(inp => {
                inp.onchange=function(e) {
                    const id=parseInt(this.closest('tr').dataset.id);
                    const h=holdings.find(x => x.id===id);
                    if(h) {
                        const val=parseFloat(this.value);
                        h.ratio=(!isNaN(val)&&val>=1)? val:h.ratio;
                        render();
                    }
                };
            });

            // Target weight changes
            document.querySelectorAll('.target-input').forEach(inp => {
                inp.onchange=function(e) {
                    const id=parseInt(this.closest('tr').dataset.id);
                    const h=holdings.find(x => x.id===id);
                    if(h) {
                        const val=parseFloat(this.value);
                        h.targetWeight=(!isNaN(val)&&val>=0&&val<=100)? val:h.targetWeight;
                        render();
                    }
                };
            });

            // Address changes (textarea)
            document.querySelectorAll('.address-input').forEach(ta => {
                ta.oninput=function(e) {
                    const id=parseInt(this.closest('tr').dataset.id);
                    const h=holdings.find(x => x.id===id);
                    if(h) {
                        h.addresses=this.value;
                        // Auto-resize rows
                        const lines=this.value.split('\n').length;
                        this.rows=Math.max(1,lines);
                    }
                };
            });

            // Delete buttons
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick=function(e) {
                    const id=parseInt(this.dataset.id);
                    const idx=holdings.findIndex(x => x.id===id);
                    if(idx!==-1) holdings.splice(idx,1);
                    render();
                };
            });

            // Drag & drop
            let dragSrcIdx=null;
            document.querySelectorAll('.drag-handle').forEach(handle => {
                handle.ondragstart=function(e) {
                    dragSrcIdx=parseInt(this.closest('tr').dataset.id);
                    e.dataTransfer.effectAllowed='move';
                };
                handle.ondragover=function(e) {e.preventDefault();};
                handle.ondrop=function(e) {
                    e.preventDefault();
                    const targetId=parseInt(this.closest('tr').dataset.id);
                    if(dragSrcIdx===null||dragSrcIdx===targetId) return;
                    const srcIdx=holdings.findIndex(x => x.id===dragSrcIdx);
                    const tgtIdx=holdings.findIndex(x => x.id===targetId);
                    if(srcIdx===-1||tgtIdx===-1) return;
                    const [moved]=holdings.splice(srcIdx,1);
                    holdings.splice(tgtIdx,0,moved);
                    render();
                };
            });
        }

        // ─── ADD ROW ──────────────────────────────────────────────
        function addRow() {
            const symbol=Object.keys(prices)[0]||'unknown';
            holdings.push({
                id: nextId++,
                symbol: symbol,
                qty: 0,
                ratio: 1,
                targetWeight: 0,
                addresses: ''
            });
            render();
        }

        document.getElementById('addRowBtn').onclick=addRow;

        // ─── EXPORT HOLDINGS ──────────────────────────────────────────
        function exportHoldings() {
            const exportData = holdings.map(h => ({
                symbol: h.symbol,
                qty: h.qty,
                ratio: h.ratio,
                targetWeight: h.targetWeight,
                addresses: h.addresses||''
            }));

            const json=JSON.stringify(exportData,null,2);
            const blob=new Blob([json],{type: 'application/json'});
            const url=URL.createObjectURL(blob);

            // Create download link
            const link=document.createElement('a');
            link.href=url;
            link.download=`portfolio.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // ─── IMPORT HOLDINGS ──────────────────────────────────────────
        function importHoldings(file) {
            const reader=new FileReader();

            reader.onload=function(e) {
                try {
                    const data=JSON.parse(e.target.result);

                    // Import each holding
                    const newHoldings=[];
                    data.forEach(item => {
                        newHoldings.push({
                            id: nextId++,
                            symbol: item.symbol,
                            qty: typeof item.qty==='number'? item.qty:0,
                            ratio: typeof item.ratio==='number'? item.ratio:1,
                            targetWeight: typeof item.targetWeight==='number'? item.targetWeight:0,
                            addresses: typeof item.addresses==='string'? item.addresses:''
                        });
                    });

                    holdings.length=0;
                    holdings.push(...newHoldings);

                    render();

                } catch(error) {
                    showError(`Failed to import: ${error.message}`);
                }
            };

            reader.onerror=function() {
                showError('Failed to read the file.');
            };

            reader.readAsText(file);
        }

        // ─── EVENT BINDING FOR IMPORT/EXPORT ──────────────────────────
        function bindImportExportEvents() {
            // Export button
            document.getElementById('exportBtn').addEventListener('click',exportHoldings);

            // Import button (triggers file picker)
            document.getElementById('importBtn').addEventListener('click',function() {
                document.getElementById('fileInput').click();
            });

            // File input change handler
            document.getElementById('fileInput').addEventListener('change',function(e) {
                if(this.files&&this.files.length>0) {
                    importHoldings(this.files[0]);
                    this.value='';
                }
            });
        }

        // ─── BOOT ────────────────────────────────────────────────
        function showError(message) {
            const overlay=document.getElementById('errorOverlay');
            const msgEl=document.getElementById('errorMessage');

            msgEl.textContent=message;
            overlay.classList.add('visible');
            overlay.style.display='flex';
        }

        async function boot() {
            try {
                const resp=await fetch('/api/prices');
                const data=await resp.json();
                if(!resp.ok) showError(`API Error: ${data.error}`);
                else{
                  prices=data;
                  bindImportExportEvents()
                  document.getElementById('overlay').classList.add('hidden');
                  addRow();
                  render();
                }
            } catch(err) {
                showError(`API Error: ${err}`);
            }
        }

        // start
        boot();
    </script>

</body>
</html>
